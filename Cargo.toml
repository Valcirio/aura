[package]
name = "aura-ui"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["crates/support-core", "crates/support-runtime", "src-tauri"]

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[profile.release]
opt-level = "s"
lto = true
