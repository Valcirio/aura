[package]
name = "aura-desktop"
version = "0.1.0"
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
support-core = { path = "../crates/support-core" }
support-runtime = { path = "../crates/support-runtime", features = ["local-speech"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
